<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Farmer Information Dashboard</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #d4fc79, #96e6a1);
      font-family: "Poppins", sans-serif;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #4caf50, #81c784);
      color: white;
      display: flex;
      align-items: center;
      padding: 15px 25px;
      gap: 15px;
    }

    .header img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      background: #fff;
      padding: 4px;
    }

    .header h1 {
      font-size: 1.6rem;
      margin: 0;
    }

    .header p {
      font-size: 0.95rem;
      margin: 0;
      font-family: 'Noto Sans Kannada', sans-serif;
    }

    .section {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .section h4 {
      color: #2e7d32;
      margin-bottom: 15px;
    }

    .table th {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .tag {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-right: 5px;
    }

    .profit {
      color: #1b5e20;
      font-weight: 600;
    }

    .loss {
      color: #c62828;
      font-weight: 600;
    }

    .neutral {
      color: #f57c00;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <img src="https://wiki.meramaal.com/wp-content/uploads/2018/08/raitamitra.jpg" alt="Raita Mitra Logo">
      <div>
        <h1>👨‍🌾 Farmer Information Dashboard</h1>
        <p>“ರೈತನೇ ದೇಶದ ಬೆನ್ನೆಲುಬು” — The Farmer is the Backbone of Our Nation</p>
      </div>
    </div>

    <!-- Farmer Input -->
    <div class="section">
      <h4>Farmer Details</h4>
      <div class="row g-2">
        <div class="col-md-5">
          <input id="name" class="form-control" placeholder="Farmer Name">
        </div>
        <div class="col-md-5">
          <input id="location" class="form-control" placeholder="Location (e.g., Mandya)">
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-success" onclick="analyzeData()">Analyze</button>
        </div>
      </div>
    </div>

    <!-- Recommended Crops -->
    <div class="section" id="suggestions" style="display:none;">
      <h4>🌾 Recommended Crops</h4>
      <p id="locName" class="fw-semibold"></p>
      <ul id="cropList" class="list-group"></ul>
    </div>

    <!-- Market Rates -->
    <div class="section" id="ratesSection" style="display:none;">
      <h4>💰 Nearby Market Rates</h4>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Crop</th>
            <th>Rate</th>
            <th>Unit</th>
            <th>Trend</th>
          </tr>
        </thead>
        <tbody id="ratesTable"></tbody>
      </table>
    </div>

    <!-- Profit/Loss -->
    <div class="section" id="profitSection" style="display:none;">
      <h4>📈 Profit / Loss Estimation</h4>
      <div id="profitList"></div>
    </div>

    <!-- Fertilizer & Sprayer -->
    <div class="section" id="fertilizerSection" style="display:none;">
      <h4>🧪 Fertilizers & Chemical Sprayers</h4>
      <div id="fertilizerList"></div>
    </div>

    <!-- Crop Diseases -->
    <div class="section" id="diseaseSection" style="display:none;">
      <h4>🐛 Common Crop Diseases</h4>
      <div id="diseaseList"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ---------- EXTENDED DATA ----------
    const cropsByLocation = {
      mandya: ["Sugarcane", "Paddy", "Ragi", "Coconut"],
      davangere: ["Maize", "Rice", "Cotton", "Sunflower"],
      mysuru: ["Turmeric", "Maize", "Banana", "Sugarcane"],
      bangalore: ["Tomato", "Cabbage", "Carrot", "Spinach"],
      belagavi: ["Maize", "Soybean", "Pigeon Pea", "Sugarcane"],
      hubli: ["Cotton", "Maize", "Pulses", "Groundnut"],
      chikkamagaluru: ["Coffee", "Cardamom", "Arecanut", "Pepper"],
      udupi: ["Coconut", "Cashew", "Arecanut", "Paddy"],
      hassan: ["Tomato", "Maize", "Ragi", "Sugarcane"]
    };

    const marketRates = {
      mandya: [
        { crop: "Paddy", rate: 2800, unit: "₹/qtl", trend: "↗ Up" },
        { crop: "Sugarcane", rate: 3200, unit: "₹/ton", trend: "→ Stable" },
        { crop: "Ragi", rate: 2700, unit: "₹/qtl", trend: "↘ Down" }
      ],
      mysuru: [
        { crop: "Turmeric", rate: 120000, unit: "₹/ton", trend: "↗ Up" },
        { crop: "Maize", rate: 1700, unit: "₹/qtl", trend: "→ Stable" }
      ],
      bangalore: [
        { crop: "Tomato", rate: 25, unit: "₹/kg", trend: "↘ Down" },
        { crop: "Cabbage", rate: 18, unit: "₹/kg", trend: "↗ Up" }
      ],
      belagavi: [
        { crop: "Maize", rate: 1600, unit: "₹/qtl", trend: "→ Stable" },
        { crop: "Soybean", rate: 4200, unit: "₹/qtl", trend: "↗ Up" }
      ],
      hubli: [
        { crop: "Cotton", rate: 5700, unit: "₹/qtl", trend: "↗ Up" },
        { crop: "Groundnut", rate: 5600, unit: "₹/qtl", trend: "→ Stable" }
      ],
      chikkamagaluru: [
        { crop: "Coffee", rate: 18000, unit: "₹/kg", trend: "↗ Up" },
        { crop: "Cardamom", rate: 2500, unit: "₹/kg", trend: "↘ Down" }
      ],
      udupi: [
        { crop: "Coconut", rate: 45, unit: "₹/kg", trend: "↗ Up" },
        { crop: "Cashew", rate: 550, unit: "₹/kg", trend: "→ Stable" }
      ],
      hassan: [
        { crop: "Ragi", rate: 2700, unit: "₹/qtl", trend: "↘ Down" },
        { crop: "Sugarcane", rate: 3200, unit: "₹/ton", trend: "→ Stable" }
      ]
    };

    const fertilizerData = {
      Paddy: { fertilizers: "Urea, DAP, MOP", sprayer: "Knapsack 16L Sprayer", note: "Apply N:120kg, P:60kg, K:40kg" },
      Sugarcane: { fertilizers: "NPK + Micronutrients", sprayer: "Boom Sprayer", note: "Use organic manure periodically" },
      Maize: { fertilizers: "Urea, DAP, Zinc Sulphate", sprayer: "Battery Sprayer", note: "Split doses, maintain drainage" },
      Ragi: { fertilizers: "DAP, MOP", sprayer: "Hand Sprayer", note: "Apply balanced NPK for yield" },
      Turmeric: { fertilizers: "Compost + NPK", sprayer: "Knapsack Sprayer", note: "Use mulch to retain moisture" },
      Tomato: { fertilizers: "NPK + Micronutrients", sprayer: "Knapsack Sprayer", note: "Foliar spray recommended" },
      Cabbage: { fertilizers: "DAP + Compost", sprayer: "Hand Sprayer", note: "Split N application" },
      Coffee: { fertilizers: "Compost + NPK", sprayer: "Knapsack Sprayer", note: "Shade trees recommended" },
      Coconut: { fertilizers: "NPK + Boron", sprayer: "Manual Sprayer", note: "Apply during flowering" },
      Cashew: { fertilizers: "NPK + Micronutrients", sprayer: "Hand Sprayer", note: "Foliar spray for better yield" },
      Cardamom: { fertilizers: "Organic Manure + NPK", sprayer: "Knapsack Sprayer", note: "Apply after harvesting" }
    };

    const diseaseData = {
      Paddy: [
        { name: "Blast", solution: "Use Tricyclazole; avoid excess N" },
        { name: "Brown Spot", solution: "Use Mancozeb; maintain soil health" }
      ],
      Maize: [{ name: "Fall Armyworm", solution: "Use Spinosad or biological control" }],
      Sugarcane: [{ name: "Red Rot", solution: "Use disease-free setts; crop rotation" }],
      Ragi: [{ name: "Smut", solution: "Use healthy seeds; avoid dense planting" }],
      Turmeric: [{ name: "Leaf Spot", solution: "Use Carbendazim; maintain drainage" }],
      Tomato: [{ name: "Blight", solution: "Apply Copper Fungicide; avoid overhead irrigation" }],
      Cabbage: [{ name: "Black Rot", solution: "Remove affected leaves; use bactericide" }],
      Coffee: [{ name: "Rust", solution: "Prune infected leaves; apply fungicide" }],
      Coconut: [{ name: "Bud Rot", solution: "Remove infected palms; spray Bordeaux mixture" }],
      Cashew: [{ name: "Dieback", solution: "Prune affected branches; use fungicide" }],
      Cardamom: [{ name: "Leaf Blight", solution: "Remove diseased leaves; apply copper oxychloride" }]
    };

    // ---------- ANALYZE FUNCTION ----------
    function analyzeData() {
      const location = document.getElementById("location").value.toLowerCase().trim();
      const crops = cropsByLocation[location] || [];
      const locDisplay = document.getElementById("locName");

      // Recommended Crops
      const cropList = document.getElementById("cropList");
      cropList.innerHTML = "";
      if (crops.length > 0) {
        crops.forEach(crop => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.textContent = crop;
          cropList.appendChild(li);
        });
        locDisplay.textContent = `Best crops for ${location.charAt(0).toUpperCase() + location.slice(1)}:`;
      } else {
        cropList.innerHTML = "<li class='list-group-item'>No data for this area.</li>";
        locDisplay.textContent = "";
      }
      document.getElementById("suggestions").style.display = "block";

      // Market Rates
      const rates = marketRates[location] || [];
      const rateTable = document.getElementById("ratesTable");
      rateTable.innerHTML = "";
      rates.forEach(r => {
        rateTable.innerHTML += `
          <tr>
            <td>${r.crop}</td>
            <td>₹${r.rate.toLocaleString()}</td>
            <td>${r.unit}</td>
            <td>${r.trend}</td>
          </tr>`;
      });
      document.getElementById("ratesSection").style.display = rates.length ? "block" : "none";

      // Profit/Loss
      const profitList = document.getElementById("profitList");
      profitList.innerHTML = "";
      rates.forEach(r => {
        const status = r.rate > 2500 ? "profit" : r.rate < 2000 ? "loss" : "neutral";
        profitList.innerHTML += `<p>${r.crop}: <span class="${status}">${status === "profit" ? "Profitable 👍" : status === "loss" ? "Loss Risk ⚠️" : "Average ⚖️"}</span></p>`;
      });
      document.getElementById("profitSection").style.display = rates.length ? "block" : "none";

      // Fertilizers
      const fertList = document.getElementById("fertilizerList");
      fertList.innerHTML = "";
      crops.forEach(crop => {
        const data = fertilizerData[crop];
        if (data) {
          fertList.innerHTML += `
            <div class="mb-3">
              <strong>${crop}</strong><br>
              <span class="tag">Fertilizers:</span> ${data.fertilizers}<br>
              <span class="tag">Sprayer:</span> ${data.sprayer}<br>
              <small>${data.note}</small>
            </div>`;
        }
      });
      document.getElementById("fertilizerSection").style.display = crops.length ? "block" : "none";

      // Diseases
      const diseaseList = document.getElementById("diseaseList");
      diseaseList.innerHTML = "";
      crops.forEach(crop => {
        const diseases = diseaseData[crop];
        if (diseases) {
          diseaseList.innerHTML += `<strong>${crop}</strong><ul>`;
          diseases.forEach(d => {
            diseaseList.innerHTML += `<li>${d.name}: ${d.solution}</li>`;
          });
          diseaseList.innerHTML += `</ul>`;
        }
      });
      document.getElementById("diseaseSection").style.display = crops.length ? "block" : "none";
    }
  </script>
</body>
</html>
